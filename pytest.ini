[pytest]
# rlogin-gateway/test_rlogin_target.py is NOT a test suite. It is a standalone
# RLOGIN echo server used by hand to validate the
# ctelnet -> doorparty_bridge -> target chain.
#
# Its name matches pytest's default discovery pattern (test_*.py), so pytest
# imports it during collection -- and at module level it does
#
#     PORT = int(sys.argv[1]) if len(sys.argv) > 1 else 19999
#
# which under pytest sees pytest's own arguments and raises
# ValueError: invalid literal for int() with base 10: '-q'.
#
# Ignoring it here rather than renaming the file, because the name is what the
# README and the project notes refer to.
addopts = --ignore=rlogin-gateway/test_rlogin_target.py
